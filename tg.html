<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Telegram Mini App — Dashboard</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56">
    </script>

    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f5f5f5;
            --text: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border: #e0e0e0;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --accent: #3390ec;
            --accent-hover: #2678d6;
            --success: #31b545;
            --warning: #f5a623;
            --danger: #e74c3c;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Telegram dark theme overrides */
        body.tg-dark {
            --bg: #1f1f1f;
            --bg-secondary: #2b2b2b;
            --text: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-muted: #777777;
            --border: #3a3a3a;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 80px 16px;
            transition: background 0.2s, color 0.2s;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Container ── */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--accent), #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 100px;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: #fff;
        }

        /* ── User Card ── */
        .user-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background 0.2s;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
            text-transform: uppercase;
            -webkit-text-fill-color: #fff;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-info .name {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
        }

        .user-info .handle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .user-info .status {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--success);
            background: rgba(49, 181, 69, 0.15);
            padding: 2px 10px;
            border-radius: 100px;
        }

        body.tg-dark .user-info .status {
            background: rgba(49, 181, 69, 0.25);
        }

        /* ── Stats Grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .stat-item {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 14px 8px;
            text-align: center;
            border: 1px solid var(--border);
            transition: background 0.2s, transform 0.15s;
        }

        .stat-item:active {
            transform: scale(0.96);
        }

        .stat-item .number {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--accent);
        }

        .stat-item .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* ── Section Title ── */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .count {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 0 10px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }

        /* ── Info Cards ── */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: background 0.15s, border-color 0.15s;
            cursor: default;
        }

        .info-card:active {
            transform: scale(0.99);
        }

        .info-card .icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            background: rgba(51, 144, 236, 0.12);
            color: var(--accent);
        }

        .info-card .icon.warning {
            background: rgba(245, 166, 35, 0.15);
            color: var(--warning);
        }

        .info-card .icon.danger {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }

        .info-card .icon.success {
            background: rgba(49, 181, 69, 0.15);
            color: var(--success);
        }

        .info-card .content {
            flex: 1;
            min-width: 0;
        }

        .info-card .content .title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        .info-card .content .desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.4;
        }

        .info-card .content .meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-card .content .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-card .tag {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 100px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .tag.urgent {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }

        .tag.new {
            background: rgba(51, 144, 236, 0.15);
            color: var(--accent);
        }

        .tag.updated {
            background: rgba(245, 166, 35, 0.15);
            color: var(--warning);
        }

        /* ── Action Button ── */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            text-align: center;
            background: var(--accent);
            color: #fff;
            -webkit-text-fill-color: #fff;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
            -webkit-text-fill-color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:active {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
        }

        /* ── Footer ── */
        .app-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .app-footer .tg-version {
            display: inline-block;
            background: var(--bg-secondary);
            padding: 2px 12px;
            border-radius: 100px;
            font-size: 11px;
            border: 1px solid var(--border);
            margin-top: 6px;
        }

        /* ── Toast / Alert ── */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast .toast-icon {
            font-size: 18px;
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 400px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .stat-item .number {
                font-size: 18px;
            }
            .info-card {
                padding: 14px 14px;
            }
            .user-card {
                padding: 14px 16px;
            }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ─── APP ─── -->
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <h1>✦ Dashboard</h1>
            <span class="badge" id="liveBadge">● Live</span>
        </header>

        <!-- User Card -->
        <div class="user-card" id="userCard">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-info">
                <div class="name" id="userName">User</div>
                <div class="handle" id="userHandle">@username</div>
                <span class="status" id="userStatus">● Online</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="number" id="statMessages">0</div>
                <div class="label">Messages</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statGroups">0</div>
                <div class="label">Groups</div>
            </div>
            <div class="stat-item">
                <div class="number" id="statAlerts">0</div>
                <div class="label">Alerts</div>
            </div>
        </div>

        <!-- Important Info Section -->
        <div class="section-title">
            📌 Important Info
            <span class="count" id="infoCount">3</span>
        </div>

        <div class="info-list" id="infoList">
            <!-- Cards will be rendered by JS -->
        </div>

        <!-- Actions -->
        <div class="action-row">
            <button class="btn" id="refreshBtn">⟳ Refresh</button>
            <button class="btn btn-secondary" id="shareBtn">📤 Share</button>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            <div>Telegram Mini App · v1.0</div>
            <div class="tg-version" id="tgVersion">WebApp v6.0</div>
        </footer>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span id="toastMessage">Done</span>
    </div>

    <!-- ─── SCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            // ── Telegram WebApp Init ──
            const tg = window.Telegram?.WebApp;

            if (tg) {
                tg.ready();
                tg.expand();

                // Apply dark theme if Telegram is in dark mode
                if (tg.colorScheme === 'dark') {
                    document.body.classList.add('tg-dark');
                }

                // Listen for theme changes
                tg.onEvent('themeChanged', function() {
                    const isDark = tg.colorScheme === 'dark';
                    document.body.classList.toggle('tg-dark', isDark);
                });

                // Show version
                document.getElementById('tgVersion').textContent =
                    `WebApp v${tg.version || '6.0'}`;
            } else {
                // Fallback: simulate dark mode based on system preference
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.body.classList.add('tg-dark');
                }
                document.getElementById('tgVersion').textContent = 'WebApp (standalone)';
            }

            // ── Data Store ──
            let infoData = [];
            let stats = {
                messages: 0,
                groups: 0,
                alerts: 0,
            };

            // ── DOM refs ──
            const infoListEl = document.getElementById('infoList');
            const infoCountEl = document.getElementById('infoCount');
            const statMessages = document.getElementById('statMessages');
            const statGroups = document.getElementById('statGroups');
            const statAlerts = document.getElementById('statAlerts');
            const userAvatar = document.getElementById('userAvatar');
            const userName = document.getElementById('userName');
            const userHandle = document.getElementById('userHandle');
            const userStatus = document.getElementById('userStatus');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const refreshBtn = document.getElementById('refreshBtn');
            const shareBtn = document.getElementById('shareBtn');
            const liveBadge = document.getElementById('liveBadge');

            // ── Helper: show toast ──
            let toastTimeout = null;

            function showToast(message, icon = '✓', duration = 2600) {
                toastMessage.textContent = message;
                document.querySelector('.toast .toast-icon').textContent = icon;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ── Helper: format time ──
            function timeAgo(date) {
                const diff = Date.now() - date.getTime();
                const mins = Math.floor(diff / 60000);
                if (mins < 1) return 'Just now';
                if (mins < 60) return `${mins}m ago`;
                const hrs = Math.floor(mins / 60);
                if (hrs < 24) return `${hrs}h ago`;
                const days = Math.floor(hrs / 24);
                return `${days}d ago`;
            }

            // ── Generate random data ──
            function generateData() {
                const now = new Date();

                const titles = [
                    '📢 System Update',
                    '🔔 Security Alert',
                    '📊 Daily Report',
                    '💬 New Message',
                    '📎 File Uploaded',
                    '🔄 Sync Complete',
                    '⚠️ High CPU Usage',
                    '✅ Task Completed',
                    '📅 Meeting Reminder',
                    '🔑 API Key Rotated',
                ];

                const descs = [
                    'v2.4.1 deployed successfully to production.',
                    'Unusual login attempt detected from IP 192.168.1.45.',
                    'Total revenue up 12% compared to yesterday.',
                    'You have 3 unread messages in the #general channel.',
                    'Project_report_Q3.pdf has been uploaded.',
                    'All data synchronized across 5 regions.',
                    'CPU usage spiked to 92% for 3 minutes.',
                    'Sprint #12 retrospective completed.',
                    'Team sync call scheduled for 3:00 PM UTC.',
                    'Old API key revoked; new key issued.',
                ];

                const tags = ['urgent', 'new', 'updated', ''];
                const tagLabels = {
                    urgent: 'Urgent',
                    new: 'New',
                    updated: 'Updated',
                    '': ''
                };
                const tagClasses = {
                    urgent: 'urgent',
                    new: 'new',
                    updated: 'updated',
                    '': ''
                };
                const icons = ['⚡', '🔔', '📊', '💬', '📎', '🔄', '⚠️', '✅', '📅', '🔑'];
                const iconTypes = ['', 'warning', '', '', '', '', 'danger', 'success', '', ''];

                // Pick 4–6 random items
                const count = 4 + Math.floor(Math.random() * 3);
                const shuffled = titles.map((_, i) => i);
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                const selected = shuffled.slice(0, count);

                const items = selected.map((idx, i) => {
                    const tag = tags[Math.floor(Math.random() * tags.length)];
                    const date = new Date(now.getTime() - Math.random() * 3600000 * 24 * 3);
                    return {
                        id: Date.now() + i + Math.random() * 1000,
                        title: titles[idx],
                        desc: descs[idx],
                        icon: icons[idx],
                        iconType: iconTypes[idx],
                        tag: tag,
                        tagLabel: tagLabels[tag],
                        tagClass: tagClasses[tag],
                        time: date,
                        timeAgo: timeAgo(date),
                        read: Math.random() > 0.3,
                    };
                });

                // Sort by time (newest first)
                items.sort((a, b) => b.time.getTime() - a.time.getTime());

                // Stats
                stats.messages = 128 + Math.floor(Math.random() * 300);
                stats.groups = 7 + Math.floor(Math.random() * 15);
                stats.alerts = items.filter(item => item.tag === 'urgent').length;

                return items;
            }

            // ── Render ──
            function render(data) {
                infoData = data;
                infoListEl.innerHTML = '';

                data.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'info-card';
                    card.style.cursor = 'pointer';

                    const iconTypeClass = item.iconType ? ` ${item.iconType}` : '';
                    card.innerHTML = `
                            <div class="icon${iconTypeClass}">${item.icon}</div>
                            <div class="content">
                                <div class="title">${item.title}</div>
                                <div class="desc">${item.desc}</div>
                                <div class="meta">
                                    <span>🕐 ${item.timeAgo}</span>
                                    <span>${item.read ? '✓ Read' : '○ Unread'}</span>
                                </div>
                            </div>
                            ${item.tag ? `<div class="tag ${item.tagClass}">${item.tagLabel}</div>` : ''}
                        `;

                    // Click → show detail via toast
                    card.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (tg) {
                            tg.showAlert(`📌 ${item.title}\n\n${item.desc}\n\n🕐 ${item.timeAgo}`);
                        } else {
                            showToast(`${item.title} — ${item.desc}`, '📌', 3000);
                        }
                    });

                    infoListEl.appendChild(card);
                });

                // Update count
                infoCountEl.textContent = data.length;

                // Update stats
                statMessages.textContent = stats.messages;
                statGroups.textContent = stats.groups;
                statAlerts.textContent = stats.alerts;

                // Update user info (simulate)
                const firstNames = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank', 'Grace', 'Henry'];
                const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis'];
                const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                const fullName = `${firstName} ${lastName}`;
                const handle = `@${firstName.toLowerCase()}${lastName.toLowerCase()}_${Math.floor(Math.random() * 100)}`;

                userName.textContent = fullName;
                userHandle.textContent = handle;
                userAvatar.textContent = firstName.charAt(0) + lastName.charAt(0);

                // Status
                const statuses = ['● Online', '● Away', '○ Offline'];
                const statusColors = ['var(--success)', 'var(--warning)', 'var(--text-muted)'];
                const idx = Math.floor(Math.random() * 3);
                userStatus.textContent = statuses[idx];
                userStatus.style.color = statusColors[idx];

                // Badge pulse
                liveBadge.style.animation = 'none';
                setTimeout(() => {
                    liveBadge.style.animation = 'pulse 2s ease-in-out infinite';
                }, 10);
            }

            // ── Refresh ──
            function refreshData() {
                const data = generateData();
                render(data);
                showToast('Dashboard updated', '⟳', 1800);

                // Haptic feedback if available
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }

            // ── Share ──
            function shareInfo() {
                const text = `📊 My Telegram Mini App Dashboard\n\n` +
                    `📩 Messages: ${stats.messages}\n` +
                    `👥 Groups: ${stats.groups}\n` +
                    `⚠️ Alerts: ${stats.alerts}\n` +
                    `📌 Latest: ${infoData[0]?.title || '—'}\n\n` +
                    `🕐 ${new Date().toLocaleString()}`;

                if (tg) {
                    tg.showPopup({
                        title: 'Share Dashboard',
                        message: text,
                        buttons: [{ text: 'Copy', type: 'default' }]
                    }, function(btnIndex) {
                        if (btnIndex === 0) {
                            // Copy to clipboard via Telegram
                            tg.showAlert('Copied to clipboard! (simulated)');
                        }
                    });
                    // Also try native share
                    if (navigator.share) {
                        navigator.share({ title: 'My Dashboard', text: text })
                            .catch(() => {});
                    } else {
                        // Fallback: copy to clipboard
                        navigator.clipboard?.writeText(text).then(() => {
                            showToast('Copied to clipboard', '📋', 2000);
                        }).catch(() => {
                            showToast('Share not available', '⚠️', 2000);
                        });
                    }
                } else {
                    // Fallback for standalone
                    navigator.clipboard?.writeText(text).then(() => {
                        showToast('Copied to clipboard', '📋', 2000);
                    }).catch(() => {
                        showToast('Share not available', '⚠️', 2000);
                    });
                }
            }

            // ── Inject pulse keyframes ──
            const styleSheet = document.createElement('style');
            styleSheet.textContent = `
                    @keyframes pulse {
                        0%, 100% { opacity: 1; }
                        50% { opacity: 0.4; }
                    }
                `;
            document.head.appendChild(styleSheet);

            // ── Init ──
            const initialData = generateData();
            render(initialData);

            // ── Event listeners ──
            refreshBtn.addEventListener('click', refreshData);
            shareBtn.addEventListener('click', shareInfo);

            // ── Telegram MainButton (if available) ──
            if (tg && tg.MainButton) {
                tg.MainButton.setText('📊 Refresh');
                tg.MainButton.onClick(refreshData);
                tg.MainButton.show();
            }

            // ── Auto-refresh every 60s ──
            let autoRefreshInterval = setInterval(refreshData, 60000);

            // ── Cleanup on page hide (optional) ──
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    clearInterval(autoRefreshInterval);
                } else {
                    autoRefreshInterval = setInterval(refreshData, 60000);
                }
            });

            console.log('✅ Telegram Mini App Dashboard ready');

        })();
    </script>

</body>
</html>
