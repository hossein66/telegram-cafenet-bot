<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Telegram Mini App — Quick Info</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js?56">
    </script>

    <style>
        /* ── Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --bg-card: #1a1a1a;
            --text: #eaeaea;
            --text-dim: #888;
            --border: #2a2a2a;
            --accent: #2eaab0;
            --radius: 10px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 14px 14px 30px;
            transition: background 0.15s, color 0.15s;
        }

        /* Telegram dark mode support – just use the same dark palette */
        body.tg-dark {
            --bg: #0f0f0f;
            --bg-card: #1a1a1a;
            --text: #eaeaea;
            --text-dim: #888;
            --border: #2a2a2a;
        }

        /* ── Layout ── */
        .app {
            max-width: 460px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header .version {
            font-size: 11px;
            color: var(--text-dim);
            background: var(--bg-card);
            padding: 3px 12px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            transition: background 0.1s;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        .card-title .dot.empty {
            background: #f85149;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            line-height: 1.5;
            border-bottom: 1px solid #ffffff08;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row .key {
            color: var(--text-dim);
            font-weight: 500;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .row .value {
            text-align: right;
            word-break: break-all;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 12px;
            max-width: 65%;
        }

        .row .value.muted {
            color: var(--text-dim);
            font-style: italic;
        }

        /* ── Theme swatches (compact) ── */
        .theme-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .theme-strip .swatch {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #00000030;
            padding: 3px 8px 3px 5px;
            border-radius: 6px;
            font-size: 10px;
            font-family: monospace;
            border: 1px solid #ffffff15;
        }

        .theme-strip .swatch .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid #ffffff20;
            flex-shrink: 0;
        }

        /* ── Copy / actions ── */
        .action-bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            transition: opacity 0.15s, transform 0.1s;
            touch-action: manipulation;
            flex: 1;
            min-width: 80px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ── Raw data ── */
        .raw-box {
            margin-top: 6px;
        }

        .raw-box textarea {
            width: 100%;
            min-height: 70px;
            background: #00000040;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 11px;
            padding: 10px;
            resize: vertical;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--accent);
            color: #fff;
            padding: 8px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Responsive ── */
        @media (max-width: 400px) {
            .row {
                font-size: 12px;
                flex-wrap: wrap;
            }
            .row .value {
                max-width: 100%;
                text-align: left;
                margin-top: 1px;
            }
            .theme-strip .swatch {
                font-size: 9px;
                padding: 2px 6px 2px 4px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── APP ─── -->
    <div class="app" id="app">

        <!-- Header -->
        <header class="header">
            <h1>📊 Mini App</h1>
            <span class="version" id="tgVersion">v6.0</span>
        </header>

        <!-- ── User ── -->
        <div class="card" id="userCard">
            <div class="card-title"><span class="dot" id="userDot"></span> User</div>
            <div id="userRows"></div>
        </div>

        <!-- ── Chat ── -->
        <div class="card" id="chatCard">
            <div class="card-title"><span class="dot" id="chatDot"></span> Chat</div>
            <div id="chatRows"></div>
        </div>

        <!-- ── Chat Type & Instance ── -->
        <div class="card" id="metaCard">
            <div class="card-title"><span class="dot" id="metaDot"></span> Context</div>
            <div id="metaRows"></div>
        </div>

        <!-- ── Start Param ── -->
        <div class="card" id="startCard">
            <div class="card-title"><span class="dot" id="startDot"></span> Start Param</div>
            <div id="startRows"></div>
        </div>

        <!-- ── Auth / Query ── -->
        <div class="card" id="authCard">
            <div class="card-title"><span class="dot" id="authDot"></span> Auth &amp; Query</div>
            <div id="authRows"></div>
        </div>

        <!-- ── Theme ── -->
        <div class="card" id="themeCard">
            <div class="card-title"><span class="dot"></span> Theme Colors</div>
            <div id="themeStrip" class="theme-strip"></div>
        </div>

        <!-- ── Device & Platform ── -->
        <div class="card" id="deviceCard">
            <div class="card-title"><span class="dot"></span> Device &amp; Platform</div>
            <div id="deviceRows"></div>
        </div>

        <!-- ── Raw initData ── -->
        <div class="card">
            <div class="card-title"><span class="dot"></span> Raw initData</div>
            <div class="raw-box">
                <textarea id="rawInitData" readonly></textarea>
            </div>
            <div class="action-bar">
                <button class="btn" id="copyInitBtn">📋 Copy</button>
                <button class="btn btn-secondary" id="refreshBtn">⟳ Refresh</button>
            </div>
        </div>

        <!-- ── JSON dump ── -->
        <div class="card">
            <div class="card-title"><span class="dot"></span> initDataUnsafe (JSON)</div>
            <div class="raw-box">
                <textarea id="jsonDump" readonly></textarea>
            </div>
            <div class="action-bar">
                <button class="btn" id="copyJsonBtn">📋 Copy JSON</button>
            </div>
        </div>

        <!-- Footer -->
        <div style="text-align:center;margin-top:16px;font-size:11px;color:var(--text-dim);">
            Telegram Mini App · fast &amp; lightweight
        </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast" id="toast">✓ Copied</div>

    <!-- ─── SCRIPT ─── -->
    <script>
        (function() {
            'use strict';

            const tg = window.Telegram?.WebApp;

            // ── Expand ──
            if (tg) {
                tg.ready();
                tg.expand();

                // Dark mode
                if (tg.colorScheme === 'dark') {
                    document.body.classList.add('tg-dark');
                }
                tg.onEvent('themeChanged', function() {
                    const isDark = tg.colorScheme === 'dark';
                    document.body.classList.toggle('tg-dark', isDark);
                });

                // Version
                document.getElementById('tgVersion').textContent = 'v' + (tg.version || '6.0');
            } else {
                document.getElementById('tgVersion').textContent = 'standalone';
            }

            // ── Helpers ──
            function escapeHtml(s) {
                if (s === undefined || s === null) return '—';
                const d = document.createElement('div');
                d.textContent = String(s);
                return d.innerHTML;
            }

            function valOrDash(v) {
                return v !== undefined && v !== null && v !== '' ? escapeHtml(v) :
                    '<span class="muted">—</span>';
            }

            function renderRows(containerId, obj, fields) {
                const container = document.getElementById(containerId);
                let html = '';
                for (const [label, key] of fields) {
                    const raw = typeof key === 'function' ? key() : obj?.[key];
                    const display = raw !== undefined && raw !== null && raw !== '' ? raw : null;
                    const cls = display === null ? ' muted' : '';
                    html += `<div class="row">
                                <span class="key">${label}</span>
                                <span class="value${cls}">${display !== null ? escapeHtml(display) : '—'}</span>
                            </div>`;
                }
                container.innerHTML = html;
            }

            function setDot(id, hasData) {
                const dot = document.getElementById(id);
                if (dot) {
                    dot.className = 'dot' + (hasData ? '' : ' empty');
                }
            }

            // ── Data ──
            const unsafe = tg?.initDataUnsafe || {};
            const user = unsafe.user || null;
            const chat = unsafe.chat || null;

            // ── Render User ──
            setDot('userDot', !!user);
            renderRows('userRows', user, [
                ['id', 'id'],
                ['first_name', 'first_name'],
                ['last_name', 'last_name'],
                ['username', 'username'],
                ['language_code', 'language_code'],
                ['is_premium', 'is_premium'],
                ['photo_url', 'photo_url'],
            ]);

            // ── Render Chat ──
            setDot('chatDot', !!chat);
            renderRows('chatRows', chat, [
                ['id', 'id'],
                ['type', 'type'],
                ['title', 'title'],
                ['username', 'username'],
            ]);

            // ── Context (chat_type + chat_instance) ──
            const hasMeta = !!(unsafe.chat_type || unsafe.chat_instance);
            setDot('metaDot', hasMeta);
            renderRows('metaRows', unsafe, [
                ['chat_type', 'chat_type'],
                ['chat_instance', 'chat_instance'],
            ]);

            // ── Start Param ──
            const hasStart = !!unsafe.start_param;
            setDot('startDot', hasStart);
            renderRows('startRows', unsafe, [
                ['start_param', 'start_param'],
            ]);

            // ── Auth / Query ──
            const hasAuth = !!(unsafe.query_id || unsafe.auth_date || unsafe.hash);
            setDot('authDot', hasAuth);
            renderRows('authRows', unsafe, [
                ['query_id', 'query_id'],
                ['auth_date', function() {
                    const d = unsafe.auth_date;
                    if (!d) return null;
                    return new Date(d * 1000).toLocaleString();
                }],
                ['can_send_after', 'can_send_after'],
                ['hash', function() {
                    const h = unsafe.hash;
                    return h ? h.substring(0, 16) + '…' : null;
                }],
            ]);

            // ── Theme Colors (compact strip) ──
            const theme = tg?.themeParams || {};
            const themeKeys = [
                ['bg_color', 'BG'],
                ['text_color', 'Text'],
                ['hint_color', 'Hint'],
                ['link_color', 'Link'],
                ['button_color', 'Btn'],
                ['button_text_color', 'BtnTxt'],
                ['secondary_bg_color', 'SecBG'],
                ['header_bg_color', 'Header'],
                ['accent_text_color', 'Accent'],
                ['section_bg_color', 'SecBG2'],
                ['destructive_text_color', 'Destr'],
                ['bottom_bar_bg_color', 'Bottom'],
            ];
            const strip = document.getElementById('themeStrip');
            let stripHtml = '';
            for (const [key, label] of themeKeys) {
                const val = theme[key];
                if (val) {
                    const hex = '#' + val;
                    stripHtml += `<div class="swatch">
                                    <span class="color-box" style="background:${hex};"></span>
                                    ${label} ${hex}
                                </div>`;
                }
            }
            strip.innerHTML = stripHtml || '<span style="color:var(--text-dim);font-size:12px;">No theme data</span>';

            // ── Device & Platform ──
            renderRows('deviceRows', null, [
                ['platform', function() { return tg?.platform || '—'; }],
                ['version', function() { return tg?.version || '—'; }],
                ['colorScheme', function() { return tg?.colorScheme || '—'; }],
                ['viewport', function() { return `${window.innerWidth}×${window.innerHeight}`; }],
                ['screen', function() { return `${screen.width}×${screen.height}`; }],
                ['dpr', function() { return window.devicePixelRatio; }],
                ['touch', function() { return 'ontouchstart' in window ? 'yes' : 'no'; }],
                ['online', function() { return navigator.onLine ? 'yes' : 'no'; }],
            ]);

            // ── Raw initData ──
            const rawEl = document.getElementById('rawInitData');
            rawEl.value = tg?.initData || '(empty — not launched from Telegram)';

            // ── JSON dump ──
            const jsonEl = document.getElementById('jsonDump');
            jsonEl.value = JSON.stringify(unsafe, null, 2);

            // ── Copy buttons ──
            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg || '✓ Copied';
                t.classList.add('show');
                clearTimeout(t._hide);
                t._hide = setTimeout(function() { t.classList.remove('show'); }, 1600);
            }

            document.getElementById('copyInitBtn').addEventListener('click', function() {
                rawEl.select();
                document.execCommand('copy');
                showToast('📋 initData copied');
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });

            document.getElementById('copyJsonBtn').addEventListener('click', function() {
                jsonEl.select();
                document.execCommand('copy');
                showToast('📋 JSON copied');
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });

            // ── Refresh ──
            document.getElementById('refreshBtn').addEventListener('click', function() {
                location.reload();
            });

            // ── Keyboard shortcut: Cmd+R / Ctrl+R to refresh ──
            document.addEventListener('keydown', function(e) {
                if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
                    e.preventDefault();
                    location.reload();
                }
            });

            console.log('✅ Telegram Mini App — Quick Info ready');
        })();
    </script>

</body>
</html>
