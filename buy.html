<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>خرید امتیاز</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ... همان استایل‌های قبلی ... */
        /* (برای اختصار، استایل‌ها را از نسخه قبلی کپی کنید) */
        /* در اینجا فقط بخش‌های اضافی برای پیغام خطای احراز هویت اضافه شده */
        .auth-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 8px;
            display: none;
            text-align: center;
        }
        .auth-error.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ====== LOADING ====== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <p>در حال اتصال...</p>
    </div>

    <!-- ====== APP ====== -->
    <div class="app tg-safe">

        <!-- ====== HEADER ====== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">📊</span>
                <div>
                    <h1>خرید امتیاز</h1>
                    <span class="sub">درخواست‌ها</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-badge" id="userBadge">
                    <span class="avatar" id="userAvatar">👤</span>
                    <span class="name" id="userName">کاربر</span>
                    <span class="status-dot"></span>
                </div>
                <span class="badge-count" id="totalRequestsBadge">۰</span>
            </div>
        </header>

        <!-- ====== FORM ====== -->
        <div class="card" id="formCard">
            <div class="card-title">
                <span class="icon">✏️</span>
                ثبت درخواست
            </div>

            <div class="auth-error" id="authError">⚠️ خطا در احراز هویت. لطفاً دوباره تلاش کنید.</div>

            <form id="requestForm" novalidate>
                <div class="form-grid">

                    <div class="form-group">
                        <label>کد ملی <span class="required">*</span></label>
                        <input type="text" id="nationalCode" placeholder="۱۲۳۴۵۶۷۸۹۰" maxlength="10" required autocomplete="off" />
                    </div>

                    <div class="form-group">
                        <label>پسورد <span class="required">*</span></label>
                        <input type="text" id="systemPassword" placeholder="••••••••" required autocomplete="off" />
                    </div>

                    <div class="form-group">
                        <label>امتیاز مورد نیاز <span class="required">*</span></label>
                        <input type="text" id="pointsAmount" placeholder="مثلاً 25,000,000" min="1" step="1" required />
                    </div>

                    <div class="form-group">
                        <label>قیمت امتیاز <span class="required">*</span></label>
                        <select id="priceType" required>
                            <option value>انتخاب</option>
                            <option value="31" selected>۳۱</option>
                            <option value="30">۳۰ و کمتر</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>اجرت (تومان)</label>
                        <div class="calc-value" id="feeDisplay">۰ <span class="unit">تومان</span></div>
                    </div>

                    <div class="form-group">
                        <label>زمان لازم تقریبی (ساعت)</label>
                        <div class="calc-value" id="timeDisplay">۰ <span class="unit">ساعت</span></div>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="submitBtn">
                                <span>📤</span> ثبت
                            </button>
                            <button type="reset" class="btn btn-outline">
                                <span>🔄</span>
                            </button>
                        </div>
                    </div>

                </div>
            </form>
        </div>

        <!-- ====== REQUESTS LIST ====== -->
        <div class="card" id="tableCard">
            <div class="card-title">
                <span class="icon">📋</span>
                درخواست‌ها
                <span class="counter-badge" id="requestCounter">
                    <span id="requestCount">۰</span>
                </span>
                <div class="view-toggle" id="viewToggle">
                    <button class="active" data-view="list" title="نمایش لیستی">📋</button>
                    <button data-view="grid" title="نمایش کارتی">📱</button>
                </div>
            </div>

            <!-- List View -->
            <div class="table-view" id="listView">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>کد ملی</th>
                                <th>امتیاز</th>
                                <th>قیمت</th>
                                <th>اجرت</th>
                                <th>زمان</th>
                                <th>وضعیت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="requestsBodyList">
                            <!-- rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Grid View -->
            <div class="grid-view hidden" id="gridView">
                <!-- rendered by JS -->
            </div>
        </div>

    </div>

    <!-- ====== DELETE MODAL ====== -->
    <div class="modal-overlay hidden" id="deleteModal">
        <div class="modal-box">
            <h3>⚠️ حذف</h3>
            <p>آیا از حذف این درخواست اطمینان دارید؟</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancelBtn">انصراف</button>
                <button class="btn btn-danger-sm" id="modalConfirmBtn" style="height:32px;padding:4px 16px;font-size:12px;border-radius:10px;">
                    <span>🗑️</span> حذف
                </button>
            </div>
        </div>
    </div>

    <!-- ====== TOAST ====== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================ -->
    <!-- ====== JAVASCRIPT ====== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- Config ----------
            const API_BASE = window.CAFENET_API_BASE || 'https://cofenet-online.ir';

            // ---------- DOM ----------
            const form = document.getElementById('requestForm');
            const nationalCode = document.getElementById('nationalCode');
            const systemPassword = document.getElementById('systemPassword');
            const pointsAmount = document.getElementById('pointsAmount');
            const priceType = document.getElementById('priceType');
            const feeDisplay = document.getElementById('feeDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const submitBtn = document.getElementById('submitBtn');
            const requestsBodyList = document.getElementById('requestsBodyList');
            const gridView = document.getElementById('gridView');
            const listView = document.getElementById('listView');
            const requestCount = document.getElementById('requestCount');
            const totalRequestsBadge = document.getElementById('totalRequestsBadge');
            const deleteModal = document.getElementById('deleteModal');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const toastContainer = document.getElementById('toastContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const viewToggle = document.getElementById('viewToggle');
            const authError = document.getElementById('authError');

            // ---------- State ----------
            let requests = [];
            let pendingDeleteId = null;
            let currentUser = null;
            let currentView = 'list';
            let authToken = null; // JWT token

            // ---------- Token management ----------
            function setToken(token) {
                authToken = token;
                if (token) {
                    localStorage.setItem('point_requests_token', token);
                } else {
                    localStorage.removeItem('point_requests_token');
                }
            }

            function getToken() {
                if (authToken) return authToken;
                const stored = localStorage.getItem('point_requests_token');
                if (stored) authToken = stored;
                return authToken;
            }

            // ---------- Telegram ----------
            function getTelegramUser() {
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const user = window.Telegram.WebApp.initDataUnsafe?.user;
                        const initData = window.Telegram.WebApp.initData;
                        if (user) return { user, initData };
                    }
                } catch (_) {}
                return null;
            }

            function initTelegram() {
                const tgData = getTelegramUser();
                if (tgData) {
                    currentUser = tgData.user;
                    const fullName = [currentUser.first_name || '', currentUser.last_name || ''].filter(Boolean).join(
                        ' ') || 'کاربر';
                    userName.textContent = fullName.length > 12 ? fullName.slice(0, 10) + '…' : fullName;
                    if (currentUser.photo_url) {
                        userAvatar.innerHTML =
                            `<img src="${currentUser.photo_url}" alt="" />`;
                    } else {
                        userAvatar.textContent = (currentUser.first_name || '👤').charAt(0);
                    }
                    if (window.Telegram && window.Telegram.WebApp) {
                        window.Telegram.WebApp.expand();
                        window.Telegram.WebApp.ready();
                    }
                    return true;
                }
                // Fallback for testing
                const saved = localStorage.getItem('tg_user_fb');
                if (saved) {
                    try {
                        currentUser = JSON.parse(saved);
                        userName.textContent = currentUser.first_name || 'کاربر';
                        userAvatar.textContent = (currentUser.first_name || 'T').charAt(0);
                        return true;
                    } catch (_) {}
                }
                // No Telegram data – show error and disable form
                authError.textContent = '⚠️ لطفاً از طریق تلگرام وارد شوید.';
                authError.classList.add('show');
                return false;
            }

            // ---------- Authentication ----------
            async function validateTelegramUser(tgData) {
                try {
                    const response = await fetch(`${API_BASE}/api/auth/telegram-login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            initData: tgData.initData || '',
                            user: tgData.user
                        })
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'خطا در ورود با تلگرام');
                    }
                    const data = await response.json();
                    if (data.token) {
                        setToken(data.token);
                        // Update user info
                        if (data.user) {
                            currentUser = data.user;
                            userName.textContent = data.user.firstName || data.user.username || 'کاربر';
                            if (data.user.photoUrl) {
                                userAvatar.innerHTML = `<img src="${data.user.photoUrl}" alt="" />`;
                            }
                        }
                        authError.classList.remove('show');
                        return true;
                    } else {
                        throw new Error('توکن دریافت نشد');
                    }
                } catch (err) {
                    console.error('Telegram login error:', err);
                    authError.textContent = `⚠️ ${err.message || 'ورود خودکار ناموفق. لطفاً دوباره تلاش کنید.'}`;
                    authError.classList.add('show');
                    return false;
                }
            }

            // ---------- API ----------
            async function apiFetch(endpoint, options = {}) {
                const url = `${API_BASE}/api${endpoint}`;
                const token = getToken();
                const headers = {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const resp = await fetch(url, { ...options, headers });
                if (resp.status === 401) {
                    // Token expired or invalid – try to re-authenticate
                    authError.textContent = '⚠️ نشست منقضی شده. لطفاً دوباره وارد شوید.';
                    authError.classList.add('show');
                    setToken(null);
                    throw new Error('Unauthorized');
                }
                if (!resp.ok) {
                    let msg = `خطا (${resp.status})`;
                    try { const d = await resp.json(); if (d.detail) msg = d.detail; } catch (_) {}
                    throw new Error(msg);
                }
                return await resp.json();
            }

            // ---------- Load requests ----------
            async function loadRequests() {
                try {
                    loadingOverlay.classList.remove('hidden');
                    const data = await apiFetch('/point-requests');
                    requests = data || [];
                    renderAll();
                    updateCounter();
                    loadingOverlay.classList.add('hidden');
                    return true;
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error');
                    loadingOverlay.classList.add('hidden');
                    return false;
                }
            }

            async function createRequest(data) {
                return await apiFetch('/point-requests', { method: 'POST', body: JSON.stringify(data) });
            }

            async function deleteRequestApi(id) {
                return await apiFetch(`/point-requests/${id}`, { method: 'DELETE' });
            }

            // ---------- Formulas ----------
            function calcFee(amt, price) {
                const a = Number(amt) || 0;
                const feeRial = price === '31' ? a * 0.3 : a * 1;
                return feeRial / 10;
            }

            function calcTimeHours(amt, price) {
                const a = Number(amt) || 0;
                if (price === '30') return ((a * 0.0000576) / 60);
                return ((a * 0.0000096) / 60);
            }

            function formatTimeHours(h) {
                if (h < 0.01) return '<۰.۰۱';
                if (h < 1) return h.toFixed(2);
                if (h < 10) return h.toFixed(1);
                if (h < 1000) return Math.round(h);
                return toPersianDigits(Math.round(h).toLocaleString());
            }

            // ---------- Helpers ----------
            function formatNumber(n) { return Number(n).toLocaleString('fa-IR'); }

            function toPersianDigits(str) {
                const m = { '0': '۰', '1': '۱', '2': '۲', '3': '۳', '4': '۴', '5': '۵', '6': '۶', '7': '۷', '8': '۸',
                    '9': '۹' };
                return String(str).replace(/\d/g, d => m[d] || d);
            }

            function getPriceDisplay(v) {
                if (v === '31') return '۳۱';
                if (v === '30') return '۳۰';
                if (v === 'under30') return '<۳۰';
                return '—';
            }

            function getStatusLabel(s) {
                const m = { 'submitted': 'ثبت', 'processing': 'پردازش', 'done': 'انجام', 'cancelled': 'لغو' };
                return m[s] || s;
            }

            function getStatusClass(s) {
                const m = { 'submitted': 'submitted', 'processing': 'processing', 'done': 'done', 'cancelled': 'cancelled' };
                return m[s] || '';
            }

            function formatDate(ts) {
                if (!ts) return '—';
                const d = new Date(ts);
                return `${toPersianDigits(d.getFullYear())}/${toPersianDigits(String(d.getMonth()+1).padStart(2,'0'))}/${toPersianDigits(String(d.getDate()).padStart(2,'0'))}`;
            }

            // ---------- Render ----------
            function renderList() {
                if (!requests || requests.length === 0) {
                    requestsBodyList.innerHTML = `
                        <tr class="empty-row">
                            <td colspan="8">
                                <span class="empty-icon">📭</span>
                                درخواستی ثبت نشده
                            </td>
                        </tr>
                    `;
                    return;
                }

                let html = '';
                requests.forEach((req, idx) => {
                    const isSubmitted = req.status === 'submitted';
                    const feeVal = req.fee !== undefined ? req.fee : calcFee(req.points_amount, req.price_type);
                    const timeH = req.time_hours !== undefined ? req.time_hours : calcTimeHours(req.points_amount, req
                        .price_type);

                    html += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${toPersianDigits(req.national_code)}</td>
                            <td>${toPersianDigits(formatNumber(req.points_amount))}</td>
                            <td>${getPriceDisplay(req.price_type)}</td>
                            <td>${toPersianDigits(formatNumber(Math.round(feeVal)))}</td>
                            <td>${formatTimeHours(timeH)}</td>
                            <td>
                                <span class="status-badge ${getStatusClass(req.status)}">
                                    ${getStatusLabel(req.status)}
                                </span>
                            </td>
                            <td>
                                <button
                                    class="delete-btn"
                                    data-id="${req.id}"
                                    ${!isSubmitted ? 'disabled' : ''}
                                    title="${isSubmitted ? 'حذف' : 'غیرقابل حذف'}"
                                >
                                    🗑️
                                </button>
                            </td>
                        </tr>
                    `;
                });

                requestsBodyList.innerHTML = html;
                attachDeleteEvents();
            }

            function renderGrid() {
                if (!requests || requests.length === 0) {
                    gridView.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:28px 12px;color:#94a3b8;font-size:13px;">
                            <span style="font-size:28px;display:block;margin-bottom:4px;">📭</span>
                            درخواستی ثبت نشده
                        </div>
                    `;
                    return;
                }

                let html = '';
                requests.forEach((req, idx) => {
                    const isSubmitted = req.status === 'submitted';
                    const feeVal = req.fee !== undefined ? req.fee : calcFee(req.points_amount, req.price_type);
                    const timeH = req.time_hours !== undefined ? req.time_hours : calcTimeHours(req.points_amount, req
                        .price_type);

                    html += `
                        <div class="request-card">
                            <div class="rc-header">
                                <span class="rc-id">#${idx + 1}</span>
                                <span class="rc-status">
                                    <span class="status-badge ${getStatusClass(req.status)}">
                                        ${getStatusLabel(req.status)}
                                    </span>
                                </span>
                            </div>
                            <div class="rc-body">
                                <div class="rc-row">
                                    <span class="rc-label">کد ملی</span>
                                    <span class="rc-value">${toPersianDigits(req.national_code)}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">امتیاز</span>
                                    <span class="rc-value">${toPersianDigits(formatNumber(req.points_amount))}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">قیمت</span>
                                    <span class="rc-value">${getPriceDisplay(req.price_type)}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">اجرت (تومان)</span>
                                    <span class="rc-value">${toPersianDigits(formatNumber(Math.round(feeVal)))}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">زمان (ساعت)</span>
                                    <span class="rc-value">${formatTimeHours(timeH)}</span>
                                </div>
                                <div class="rc-row" style="border-bottom:none;padding-top:2px;">
                                    <span class="rc-label">تاریخ</span>
                                    <span class="rc-value" style="font-weight:400;font-size:10px;color:#94a3b8;">${formatDate(req.created_at)}</span>
                                </div>
                            </div>
                            <div class="rc-actions">
                                <button
                                    class="delete-btn"
                                    data-id="${req.id}"
                                    ${!isSubmitted ? 'disabled' : ''}
                                    title="${isSubmitted ? 'حذف' : 'غیرقابل حذف'}"
                                >
                                    🗑️ حذف
                                </button>
                            </div>
                        </div>
                    `;
                });

                gridView.innerHTML = html;
                gridView.querySelectorAll('.delete-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', () => openDeleteModal(Number(btn.dataset.id)));
                });
            }

            function renderAll() {
                renderList();
                renderGrid();
                updateViewVisibility();
            }

            function attachDeleteEvents() {
                document.querySelectorAll('#requestsBodyList .delete-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', () => openDeleteModal(Number(btn.dataset.id)));
                });
            }

            function updateViewVisibility() {
                if (currentView === 'list') {
                    listView.classList.remove('hidden');
                    gridView.classList.add('hidden');
                } else {
                    listView.classList.add('hidden');
                    gridView.classList.remove('hidden');
                }
                document.querySelectorAll('#viewToggle button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === currentView);
                });
            }

            function updateCounter() {
                const c = requests ? requests.length : 0;
                requestCount.textContent = toPersianDigits(String(c));
                totalRequestsBadge.textContent = toPersianDigits(String(c));
            }

            // ---------- View toggle ----------
            document.querySelectorAll('#viewToggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.dataset.view;
                    if (view === currentView) return;
                    currentView = view;
                    updateViewVisibility();
                });
            });

            // ---------- Toast ----------
            function showToast(msg, type = 'info') {
                const el = document.createElement('div');
                el.className = `toast toast-${type}`;
                el.textContent = msg;
                toastContainer.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transition = 'opacity 0.4s';
                    setTimeout(() => el.remove(), 400);
                }, 3500);
            }

            // ---------- Modal ----------
            function openDeleteModal(id) { pendingDeleteId = id;
                deleteModal.classList.remove('hidden'); }

            function closeDeleteModal() { deleteModal.classList.add('hidden');
                pendingDeleteId = null; }

            modalCancelBtn.addEventListener('click', closeDeleteModal);
            deleteModal.addEventListener('click', e => { if (e.target === deleteModal) closeDeleteModal(); });

            modalConfirmBtn.addEventListener('click', async function() {
                if (pendingDeleteId === null) return;
                const id = pendingDeleteId;
                try {
                    modalConfirmBtn.disabled = true;
                    modalConfirmBtn.innerHTML = `<span class="spinner"></span>`;
                    await deleteRequestApi(id);
                    requests = requests.filter(r => r.id !== id);
                    renderAll();
                    updateCounter();
                    showToast('✅ حذف شد', 'success');
                    closeDeleteModal();
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error');
                } finally {
                    modalConfirmBtn.disabled = false;
                    modalConfirmBtn.innerHTML = `<span>🗑️</span> حذف`;
                }
            });

            // ---------- Number formatting (pointsAmount) ----------
            function toEnglishDigits(str) {
                const m = {
                    '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4',
                    '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9'
                };
                return String(str).replace(/[۰-۹]/g, d => m[d] || d);
            }

            function parseNumberFromFormatted(str) {
                const onlyDigits = String(str).replace(/[^۰-۹0-9]/g, '');
                const englishDigits = toEnglishDigits(onlyDigits);
                return Number(englishDigits) || 0;
            }

            function formatNumberWithCommas(num) {
                if (!num || num === 0) return '';
                return Number(num).toLocaleString('fa-IR');
            }

            function amountChanged() {
                const rawValue = pointsAmount.value;
                const amt = parseNumberFromFormatted(rawValue);
                if (amt > 0) {
                    const formatted = formatNumberWithCommas(amt);
                    pointsAmount.value = formatted;
                    updateCalculations();
                } else {
                    pointsAmount.value = '';
                    updateCalculations();
                }
            }

            pointsAmount.addEventListener('input', amountChanged);
            pointsAmount.addEventListener('blur', amountChanged);

            // ---------- Calculations ----------
            function updateCalculations() {
                const amt = parseNumberFromFormatted(pointsAmount.value);
                const price = priceType.value;
                if (amt > 0 && price) {
                    const fee = calcFee(amt, price);
                    const hours = calcTimeHours(amt, price);
                    feeDisplay.innerHTML =
                        `${toPersianDigits(formatNumber(Math.round(fee)))} <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML =
                        `${formatTimeHours(hours)} <span class="unit">ساعت</span>`;
                } else {
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                }
            }

            // ---------- Form submit ----------
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Check token
                if (!getToken()) {
                    showToast('⚠️ ابتدا وارد شوید.', 'warning');
                    return;
                }

                const national = nationalCode.value.trim();
                const password = systemPassword.value.trim();
                const amount = parseNumberFromFormatted(pointsAmount.value);
                const price = priceType.value;

                if (!national || national.length !== 10 || !/^\d{10}$/.test(national)) {
                    showToast('کد ملی ۱۰ رقم باشد', 'error');
                    nationalCode.focus();
                    return;
                }
                if (!password || password.length < 4) {
                    showToast('پسورد حداقل ۴ کاراکتر', 'error');
                    systemPassword.focus();
                    return;
                }
                if (!amount || amount < 1) {
                    showToast('امتیاز مثبت وارد کنید', 'error');
                    pointsAmount.focus();
                    return;
                }
                if (!price) {
                    showToast('قیمت را انتخاب کنید', 'error');
                    priceType.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span>`;

                try {
                    const fee = calcFee(amount, price);
                    const timeH = calcTimeHours(amount, price);
                    const payload = {
                        national_code: national,
                        system_password: password,
                        points_amount: amount,
                        price_type: price,
                        fee: fee,
                        time_hours: timeH,
                        status: 'submitted',
                    };
                    const result = await createRequest(payload);
                    requests.push({
                        id: result.requestId || Date.now(),
                        national_code: national,
                        points_amount: amount,
                        price_type: price,
                        fee: fee,
                        time_hours: timeH,
                        status: 'submitted',
                        created_at: new Date().toISOString(),
                    });
                    renderAll();
                    updateCounter();
                    showToast('✅ ثبت شد', 'success');
                    form.reset();
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                    nationalCode.focus();
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>📤</span> ثبت`;
                }
            });

            // ---------- Events ----------
            priceType.addEventListener('change', updateCalculations);

            form.addEventListener('reset', function() {
                setTimeout(() => {
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                }, 10);
            });

            nationalCode.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !deleteModal.classList.contains('hidden')) closeDeleteModal();
            });

            // ---------- Init ----------
            async function init() {
                // 1. Get Telegram data
                const hasTelegram = initTelegram();
                if (hasTelegram) {
                    const tgData = getTelegramUser();
                    if (tgData) {
                        // 2. Authenticate
                        const loggedIn = await validateTelegramUser(tgData);
                        if (!loggedIn) {
                            // Show error, but allow user to retry? We'll still load requests if there's a token in storage
                            // If no token, requests will fail with 401
                        }
                    }
                }

                // 3. Load requests (will use token if available)
                await loadRequests();

                // 4. If no requests, render empty state
                if (!requests || requests.length === 0) {
                    renderAll();
                    updateCounter();
                }

                // 5. Focus on first field
                nationalCode.focus();

                console.log('🚀 App ready | view:', currentView);
                console.log('📐 Time formula: division');
                console.log('💰 Fee: divided by 10 (Rial → Toman)');
                console.log('🔑 Token present:', !!getToken());
            }

            // Check for token on load
            if (getToken()) {
                // Token exists, proceed
            }

            init();

        })();
    </script>

</body>
</html>
