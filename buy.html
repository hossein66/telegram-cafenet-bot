<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>خرید امتیاز</title>

    <!-- ⭐ Telegram WebApp SDK (ضروری) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        /* ---------- Reset & Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f6;
            color: #1e293b;
            padding: 6px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            direction: rtl;
            font-size: 14px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* ---------- Header ---------- */
        .header {
            background: linear-gradient(135deg, #0f2b5e, #1e4a8a);
            color: #fff;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(15, 43, 94, 0.25);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .header-left .logo {
            font-size: 20px;
            line-height: 1;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-left .sub {
            font-size: 9px;
            font-weight: 400;
            opacity: 0.7;
            display: block;
            margin-top: -1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .user-badge {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            padding: 2px 8px 2px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 120px;
        }

        .user-badge .avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            overflow: hidden;
        }

        .user-badge .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-badge .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60px;
            font-size: 10px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            flex-shrink: 0;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .badge-count {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* دکمه ورود / رفرش */
        .login-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            font-family: 'Vazirmatn', sans-serif;
            white-space: nowrap;
        }
        .login-btn:hover {
            background: rgba(255, 255, 255, 0.20);
        }

        /* ---------- Cards ---------- */
        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f6;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title .icon {
            font-size: 15px;
        }

        .card-title .counter-badge {
            background: #eef2f6;
            color: #1e293b;
            padding: 0 10px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            margin-right: auto;
        }

        .card-title .counter-badge span {
            color: #1e4a8a;
        }

        .card-title .view-toggle {
            display: flex;
            gap: 2px;
            background: #eef2f6;
            border-radius: 8px;
            padding: 2px;
            margin-right: 4px;
        }

        .card-title .view-toggle button {
            background: transparent;
            border: none;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
            color: #64748b;
            transition: all 0.15s;
            height: 26px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .card-title .view-toggle button.active {
            background: #fff;
            color: #1e4a8a;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .card-title .view-toggle button:hover:not(.active) {
            color: #1e293b;
        }

        /* ---------- Form ---------- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 600;
            font-size: 10px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .form-group label .required {
            color: #ef4444;
            font-size: 12px;
        }

        .form-group input,
        .form-group select {
            padding: 6px 10px;
            border: 1.5px solid #dce2ec;
            border-radius: 10px;
            font-size: 12px;
            background: #fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            color: #1e293b;
            width: 100%;
            height: 34px;
            appearance: auto;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
            background: #fff;
        }

        .form-group input::placeholder {
            font-size: 11px;
            color: #aab4c4;
        }

        .form-group .hint {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 1px;
        }

        .form-group .calc-value {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            background: #f1f5f9;
            padding: 5px 10px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 34px;
        }

        .form-group .calc-value .unit {
            font-weight: 400;
            font-size: 11px;
            color: #64748b;
            margin-right: 3px;
        }

        .calc-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        /* ---------- Buttons ---------- */
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
            height: 34px;
        }

        .btn-primary {
            background: #1e4a8a;
            color: #fff;
            box-shadow: 0 3px 12px rgba(30, 74, 138, 0.25);
            flex: 1;
        }
        .btn-primary:hover:not(:disabled) {
            background: #163d73;
            transform: translateY(-1px);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #dce2ec;
            color: #475569;
            padding: 6px 12px;
        }
        .btn-outline:hover:not(:disabled) {
            background: #f1f5f9;
        }

        .btn-danger-sm {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            height: 24px;
        }
        .btn-danger-sm:hover:not(:disabled) {
            background: #b91c1c;
        }
        .btn-danger-sm:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }

        /* ---------- Table (List View) ---------- */
        .table-wrap {
            overflow-x: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            min-width: 480px;
        }

        thead {
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        thead th {
            padding: 5px 6px;
            text-align: right;
            font-weight: 700;
            color: #475569;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #f1f4f9;
            transition: background 0.1s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 5px 6px;
            vertical-align: middle;
            color: #1e293b;
            font-size: 11px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 1px 8px;
            border-radius: 30px;
            font-size: 9px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.submitted {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.submitted::before {
            content: "●";
            font-size: 5px;
            color: #1d4ed8;
        }

        .status-badge.processing {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.processing::before {
            content: "●";
            font-size: 5px;
            color: #b45309;
            animation: pulse-dot 1.5s infinite;
        }

        .status-badge.done {
            background: #d1fae5;
            color: #065f46;
        }
        .status-badge.done::before {
            content: "✓";
            font-size: 9px;
            font-weight: 700;
        }

        .status-badge.cancelled {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-badge.cancelled::before {
            content: "✕";
            font-size: 9px;
        }

        .empty-row td {
            padding: 24px 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .empty-row .empty-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
        }

        .delete-btn:hover:not(:disabled) {
            color: #dc2626;
            background: #fef2f2;
        }

        .delete-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* ---------- Grid View ---------- */
        .grid-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 2px 0;
        }

        .grid-view .request-card {
            background: #f8fafc;
            border: 1px solid #eef2f6;
            border-radius: 12px;
            padding: 10px 12px;
            transition: all 0.15s;
            position: relative;
        }

        .grid-view .request-card:hover {
            border-color: #dce2ec;
        }

        .grid-view .request-card .rc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
            gap: 4px;
        }

        .grid-view .request-card .rc-id {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
        }

        .grid-view .request-card .rc-status {
            flex-shrink: 0;
        }

        .grid-view .request-card .rc-body {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .grid-view .request-card .rc-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #475569;
            padding: 1px 0;
            border-bottom: 1px dashed #eef2f6;
        }

        .grid-view .request-card .rc-row:last-child {
            border-bottom: none;
        }

        .grid-view .request-card .rc-row .rc-label {
            color: #94a3b8;
            font-weight: 400;
            font-size: 10px;
        }

        .grid-view .request-card .rc-row .rc-value {
            font-weight: 600;
            color: #0f172a;
            font-size: 11px;
        }

        .grid-view .request-card .rc-actions {
            margin-top: 6px;
            display: flex;
            justify-content: flex-end;
        }

        .grid-view .request-card .rc-actions .delete-btn {
            font-size: 12px;
            padding: 2px 6px;
        }

        .grid-view.hidden {
            display: none;
        }

        .table-view.hidden {
            display: none;
        }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            width: 94%;
            max-width: 400px;
            pointer-events: none;
        }

        .toast {
            padding: 8px 16px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            font-size: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
            animation: slideDown 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
        }

        .toast-success {
            background: #059669;
        }
        .toast-error {
            background: #dc2626;
        }
        .toast-info {
            background: #2563eb;
        }
        .toast-warning {
            background: #d97706;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-14px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
            padding: 16px;
        }

        .modal-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px 24px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 56px rgba(0, 0, 0, 0.12);
            animation: scaleIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-box h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #0f172a;
        }

        .modal-box p {
            color: #475569;
            margin-bottom: 14px;
            font-size: 13px;
            line-height: 1.6;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-box .modal-actions .btn {
            height: 32px;
            padding: 4px 14px;
            font-size: 12px;
        }

        /* ---------- Spinner ---------- */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn .spinner {
            width: 12px;
            height: 12px;
            border-width: 2px;
        }

        /* ---------- Loading overlay ---------- */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            z-index: 9997;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.35s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-overlay .loader {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #1e4a8a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-overlay p {
            color: #475569;
            font-size: 12px;
            font-weight: 500;
        }

        /* ---------- Dark mode ---------- */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
            }
            .card {
                background: #1e293b;
                border-color: #334155;
            }
            .card-title {
                color: #f1f5f9;
            }
            .card-title .counter-badge {
                background: #334155;
                color: #e2e8f0;
            }
            .card-title .view-toggle {
                background: #0f172a;
            }
            .card-title .view-toggle button {
                color: #94a3b8;
            }
            .card-title .view-toggle button.active {
                background: #1e293b;
                color: #60a5fa;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            }
            .form-group label {
                color: #cbd5e1;
            }
            .form-group input,
            .form-group select {
                background: #0f172a;
                border-color: #334155;
                color: #f1f5f9;
            }
            .form-group input:focus,
            .form-group select:focus {
                background: #1e293b;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
            }
            .form-group input::placeholder {
                color: #64748b;
            }
            .form-group .calc-value {
                background: #0f172a;
                border-color: #334155;
                color: #f1f5f9;
            }
            .form-group .calc-value .unit {
                color: #94a3b8;
            }
            .form-group .hint {
                color: #64748b;
            }
            thead {
                background: #0f172a;
                border-bottom-color: #334155;
            }
            thead th {
                color: #94a3b8;
            }
            tbody tr {
                border-bottom-color: #1e293b;
            }
            tbody tr:hover {
                background: #1a2332;
            }
            tbody td {
                color: #e2e8f0;
            }
            .table-wrap {
                border-color: #334155;
            }
            .btn-outline {
                border-color: #334155;
                color: #94a3b8;
            }
            .btn-outline:hover:not(:disabled) {
                background: #1e293b;
            }
            .modal-box {
                background: #1e293b;
            }
            .modal-box h3 {
                color: #f1f5f9;
            }
            .modal-box p {
                color: #cbd5e1;
            }
            .delete-btn:hover:not(:disabled) {
                background: #2a1a1a;
            }
            .loading-overlay {
                background: rgba(15, 23, 42, 0.80);
            }
            .loading-overlay p {
                color: #cbd5e1;
            }
            .header {
                background: linear-gradient(135deg, #0a1e3d, #163d73);
            }
            .empty-row td {
                color: #64748b;
            }
            .status-badge.submitted {
                background: #1a2a4a;
                color: #60a5fa;
            }
            .status-badge.processing {
                background: #3d2e1a;
                color: #fbbf24;
            }
            .status-badge.done {
                background: #1a3a2a;
                color: #34d399;
            }
            .status-badge.cancelled {
                background: #3a1a1a;

            }
            .badge-count {
                background: rgba(255, 255, 255, 0.05);
            }
            .user-badge {
                background: rgba(255, 255, 255, 0.05);
            }
            .grid-view .request-card {
                background: #0f172a;
                border-color: #334155;

            .grid-view .request-card .rc-row {

            }
            .grid-view .request-card .rc-row .rc-value {

            }
            .grid-view .request-card .rc-row .rc-label {
                color: #64748b;
            }
            .grid-view .request-card .rc-id {

            }
            .login-btn {
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.10);

        /* ---------- Telegram safe area ---------- */
        .tg-safe {

        /* ---------- Extra small tweaks ---------- */

        }
        .items-center {
            align-items: center;

        /* ---------- Responsive grid ---------- */
        @media (max-width: 400px) {
            .grid-view {
                grid-template-columns: 1fr;

            .form-grid {

                font-size: 10px;

                font-size: 8px;
                padding: 4px 4px;

            .grid-view {
                grid-template-columns: 1fr 1fr;

        /* خطای احراز هویت */
        .auth-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 10px;

<body>

    <!-- ====== LOADING ====== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <p>در حال اتصال...</p>
    </div>

    <!-- ====== APP ====== -->
    <div class="app tg-safe">

        <!-- ====== HEADER ====== -->
        <header class="header">
            <div class="header-left">
                <span class="logo">📊</span>
                <div>
                    <h1>خرید امتیاز</h1>
                    <span class="sub">درخواست‌ها</span>
                </div>
            </div>
            <div class="header-right">
                <!-- کاربر و دکمه ورود -->
                <div class="user-badge" id="userBadge" style="display:none;">
                    <span class="avatar" id="userAvatar">👤</span>
                    <span class="name" id="userName">کاربر</span>
                    <span class="status-dot"></span>
                </div>
                <button class="login-btn" id="loginBtn" style="display:none;" onclick="triggerLogin()">
                    🔑 ورود / ثبت‌نام
                </button>
                <span class="badge-count" id="totalRequestsBadge">۰</span>

        <!-- ====== FORM ====== -->
        <div class="card" id="formCard">
            <div class="card-title">
                <span class="icon">✏️</span>

            <div class="auth-error" id="authError">⚠️ خطا در احراز هویت. لطفاً دوباره تلاش کنید.</div>

            <form id="requestForm" novalidate>
                <div class="form-grid">

                    <div class="form-group">
                        <label>کد ملی <span class="required">*</span></label>
                        <input type="text" id="nationalCode" placeholder="۱۲۳۴۵۶۷۸۹۰" maxlength="10" required autocomplete="off" />
                    </div>

                    <div class="form-group">
                        <label>پسورد <span class="required">*</span></label>
                        <input type="text" id="systemPassword" placeholder="••••••••" required autocomplete="off" />
                    </div>

                    <div class="form-group">
                        <label>امتیاز مورد نیاز <span class="required">*</span></label>
                        <input type="text" id="pointsAmount" placeholder="مثلاً 25,000,000" min="1" step="1" required />
                    </div>

                    <div class="form-group">
                        <label>قیمت امتیاز <span class="required">*</span></label>
                        <select id="priceType" required>
                            <option value>انتخاب</option>

                    </div>

                    <div class="form-group">

                    </div>

                    <div class="form-group">
                        <label>زمان لازم تقریبی (ساعت)</label>
                        <div class="calc-value" id="timeDisplay">۰ <span class="unit">ساعت</span></div>

                    <div class="form-group full-width">
                        <div class="form-actions">

                                <span>📤</span> ثبت

                            <button type="reset" class="btn btn-outline">
                                <span>🔄</span>
                            </button>
                        </div>
                    </div>

                </div>
            </form>
        </div>

        <!-- ====== REQUESTS LIST ====== -->
        <div class="card" id="tableCard">
            <div class="card-title">
                <span class="icon">📋</span>
                درخواست‌ها
                <span class="counter-badge" id="requestCounter">
                    <span id="requestCount">۰</span>
                </span>
                <div class="view-toggle" id="viewToggle">
                    <button class="active" data-view="list" title="نمایش لیستی">📋</button>
                    <button data-view="grid" title="نمایش کارتی">📱</button>
                </div>
            </div>

            <!-- List View -->
            <div class="table-view" id="listView">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>کد ملی</th>
                                <th>امتیاز</th>
                                <th>قیمت</th>
                                <th>اجرت</th>
                                <th>زمان</th>
                                <th>وضعیت</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="requestsBodyList">
                            <!-- rendered by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Grid View -->
            <div class="grid-view hidden" id="gridView">
                <!-- rendered by JS -->

    </div>

    <!-- ====== DELETE MODAL ====== -->
    <div class="modal-overlay hidden" id="deleteModal">
        <div class="modal-box">
            <h3>⚠️ حذف</h3>
            <p>آیا از حذف این درخواست اطمینان دارید؟</p>
            <div class="modal-actions">
                <button class="btn btn-outline" id="modalCancelBtn">انصراف</button>
                <button class="btn btn-danger-sm" id="modalConfirmBtn" style="height:32px;padding:4px 16px;font-size:12px;border-radius:10px;">
                    <span>🗑️</span> حذف
                </button>
            </div>
        </div>
    </div>

    <!-- ====== TOAST ====== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================ -->
    <!-- ====== JAVASCRIPT ====== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ---------- Config ----------
            const API_BASE = window.CAFENET_API_BASE || 'https://cofenet-online.ir';

            // ---------- DOM ----------
            const form = document.getElementById('requestForm');
            const nationalCode = document.getElementById('nationalCode');
            const systemPassword = document.getElementById('systemPassword');
            const pointsAmount = document.getElementById('pointsAmount');
            const priceType = document.getElementById('priceType');
            const feeDisplay = document.getElementById('feeDisplay');
            const timeDisplay = document.getElementById('timeDisplay');
            const submitBtn = document.getElementById('submitBtn');
            const requestsBodyList = document.getElementById('requestsBodyList');
            const gridView = document.getElementById('gridView');
            const listView = document.getElementById('listView');
            const requestCount = document.getElementById('requestCount');
            const totalRequestsBadge = document.getElementById('totalRequestsBadge');
            const deleteModal = document.getElementById('deleteModal');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');
            const toastContainer = document.getElementById('toastContainer');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const userName = document.getElementById('userName');
            const userAvatar = document.getElementById('userAvatar');
            const userBadge = document.getElementById('userBadge');
            const loginBtn = document.getElementById('loginBtn');
            const viewToggle = document.getElementById('viewToggle');
            const authError = document.getElementById('authError');

            // ---------- State ----------
            let requests = [];
            let pendingDeleteId = null;
            let currentUser = null;
            let currentView = 'list';
            let authToken = null;

            // ---------- Token management ----------
            function setToken(token) {
                authToken = token;
                if (token) {
                    localStorage.setItem('point_requests_token', token);
                } else {
                    localStorage.removeItem('point_requests_token');
                }
            }

            function getToken() {
                if (authToken) return authToken;
                const stored = localStorage.getItem('point_requests_token');
                if (stored) authToken = stored;
                return authToken;
            }

            // ---------- Telegram helpers ----------
            function getTelegramUser() {
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const user = window.Telegram.WebApp.initDataUnsafe?.user;
                        const initData = window.Telegram.WebApp.initData;
                        if (user) return { user, initData };
                    }
                } catch (_) {}
                return null;
            }

            function getStartParamFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('tgWebAppStartParam');
            }

            function updateUserUI() {
                if (currentUser) {
                    const fullName = [currentUser.firstName || '', currentUser.lastName || ''].filter(Boolean).join(
                        ' ') || 'کاربر';
                    userName.textContent = fullName.length > 12 ? fullName.slice(0, 10) + '…' : fullName;
                    if (currentUser.photo_url) {
                        userAvatar.innerHTML = `<img src="${currentUser.photo_url}" alt="" />`;
                    } else {
                        userAvatar.textContent = (currentUser.firstName || '👤').charAt(0);
                    }
                    userBadge.style.display = 'flex';
                    loginBtn.style.display = 'none';
                    authError.classList.remove('show');
                } else {
                    userBadge.style.display = 'none';
                    loginBtn.style.display = 'inline-block';
                }
            }

            // ---------- Authentication functions ----------
            async function validateTelegramUser(tgData) {
                try {
                    const response = await fetch(`${API_BASE}/api/auth/telegram-login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            initData: tgData.initData || '',
                            user: tgData.user
                        })
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'خطا در ورود با تلگرام');
                    }
                    const result = await response.json();
                    if (result.token && result.user) {
                        setToken(result.token);
                        currentUser = result.user;
                        localStorage.setItem('tg_user_fb', JSON.stringify(currentUser));
                        updateUserUI();
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.expand();
                        }
                        return true;
                    } else {
                        throw new Error('توکن دریافت نشد');
                    }
                } catch (err) {
                    console.error('Telegram auto-login error:', err);
                    authError.textContent = `⚠️ ${err.message || 'ورود خودکار ناموفق. لطفاً دوباره تلاش کنید.'}`;
                    authError.classList.add('show');
                    return false;
                }
            }

            async function handleTelegramStartParam() {
                const startParam = getStartParamFromUrl();
                if (!startParam) return false;
                if (!window.Telegram || !window.Telegram.WebApp) return false;

                const tgData = getTelegramUser();
                if (!tgData) {
                    authError.textContent = '⚠️ اطلاعات کاربری از تلگرام دریافت نشد';
                    authError.classList.add('show');
                    return false;
                }

                try {
                    const response = await fetch(`${API_BASE}/api/auth/telegram-login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            initData: tgData.initData || '',
                            user: tgData.user,
                            key: startParam
                        })
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.detail || 'خطا در ورود با تلگرام');
                    }
                    const result = await response.json();
                    if (result.token && result.user) {
                        setToken(result.token);
                        currentUser = result.user;
                        localStorage.setItem('tg_user_fb', JSON.stringify(currentUser));
                        updateUserUI();
                        if (window.Telegram && window.Telegram.WebApp) {
                            window.Telegram.WebApp.expand();
                        }
                        // Optionally restore request data from the key
                        try {
                            const statusResp = await fetch(
                                `${API_BASE}/api/auth/telegram/status?key=${encodeURIComponent(startParam)}&status=_autorized`
                            );
                            const statusData = await statusResp.json();
                            if (statusData.status === 'completed' && statusData.requestData) {
                                showToast('🔁 درخواست قبلی بازیابی شد', 'info');
                            }
                        } catch (e) { /* ignore */ }
                        return true;
                    } else {
                        throw new Error('توکن دریافت نشد');
                    }
                } catch (err) {
                    console.error('Telegram bot-login error:', err);
                    authError.textContent = `⚠️ ${err.message}`;
                    authError.classList.add('show');
                    return false;
                }
            }

            // ---------- تابع رفرش / ورود مجدد ----------
            window.triggerLogin = async function() {
                authError.classList.remove('show');
                showToast('🔄 در حال ورود مجدد...', 'info');
                const startParam = getStartParamFromUrl();
                let success = false;
                if (startParam) {
                    success = await handleTelegramStartParam();
                } else {
                    const tgData = getTelegramUser();
                    if (tgData) {
                        success = await validateTelegramUser(tgData);
                    } else {
                        authError.textContent = '⚠️ لطفاً از طریق تلگرام وارد شوید.';
                        authError.classList.add('show');
                    }
                }
                if (success) {
                    showToast('✅ ورود موفق', 'success');
                    // Reload requests
                    await loadRequests();
                    if (!requests || requests.length === 0) {
                        renderAll();
                        updateCounter();
                    }
                } else {
                    showToast('❌ ورود ناموفق، دوباره تلاش کنید', 'error');
                }
            };

            // ---------- API ----------
            async function apiFetch(endpoint, options = {}) {
                const url = `${API_BASE}/api${endpoint}`;
                const token = getToken();
                const headers = {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const resp = await fetch(url, { ...options, headers });
                if (resp.status === 401) {
                    // Token expired – clear and show error
                    setToken(null);
                    currentUser = null;
                    updateUserUI();
                    authError.textContent = '⚠️ نشست منقضی شده. لطفاً دوباره وارد شوید.';
                    authError.classList.add('show');
                    throw new Error('Unauthorized');
                }
                if (!resp.ok) {
                    let msg = `خطا (${resp.status})`;
                    try { const d = await resp.json(); if (d.detail) msg = d.detail; } catch (_) {}
                    throw new Error(msg);
                }
                return await resp.json();
            }

            // ---------- Load requests ----------
            async function loadRequests() {
                try {
                    loadingOverlay.classList.remove('hidden');
                    const data = await apiFetch('/point-requests');
                    requests = data || [];
                    renderAll();
                    updateCounter();
                    loadingOverlay.classList.add('hidden');
                    return true;
                } catch (err) {
                    loadingOverlay.classList.add('hidden');
                    if (err.message !== 'Unauthorized') {
                        showToast(`❌ ${err.message}`, 'error');
                    }
                    return false;
                }
            }

            async function createRequest(data) {
                return await apiFetch('/point-requests', { method: 'POST', body: JSON.stringify(data) });
            }

async function deleteRequestApi(id) {
    return await apiFetch(`/point-requests/${id}`, { method: 'DELETE' });
}

            // ---------- Formulas ----------
            function calcFee(amt, price) {
                const a = Number(amt) || 0;
                const feeRial = price === '31' ? a * 0.3 : a * 1;
                return feeRial / 10;
            }

            function calcTimeHours(amt, price) {
                const a = Number(amt) || 0;
                if (price === '30') return ((a * 0.0000576) / 60);
                return ((a * 0.0000096) / 60);
            }

            function formatTimeHours(h) {
                if (h < 0.01) return '<۰.۰۱';
                if (h < 1) return h.toFixed(2);
                if (h < 10) return h.toFixed(1);
                if (h < 1000) return Math.round(h);
                return toPersianDigits(Math.round(h).toLocaleString());
            }

            // ---------- Helpers ----------
            function formatNumber(n) { return Number(n).toLocaleString('fa-IR'); }

            function toPersianDigits(str) {
                const m = { '0': '۰', '1': '۱', '2': '۲', '3': '۳', '4': '۴', '5': '۵', '6': '۶', '7': '۷', '8': '۸',
                    '9': '۹' };
                return String(str).replace(/\d/g, d => m[d] || d);
            }

            function getPriceDisplay(v) {
                if (v === '31') return '۳۱';
                if (v === '30') return '۳۰';
                if (v === 'under30') return '<۳۰';
                return '—';
            }

            function getStatusLabel(s) {
                const m = { 'submitted': 'ثبت', 'processing': 'پردازش', 'done': 'انجام', 'cancelled': 'لغو' };
                return m[s] || s;
            }

            function getStatusClass(s) {
                const m = { 'submitted': 'submitted', 'processing': 'processing', 'done': 'done', 'cancelled': 'cancelled' };
                return m[s] || '';
            }

            function formatDate(ts) {
                if (!ts) return '—';
                const d = new Date(ts);
                return `${toPersianDigits(d.getFullYear())}/${toPersianDigits(String(d.getMonth()+1).padStart(2,'0'))}/${toPersianDigits(String(d.getDate()).padStart(2,'0'))}`;
            }

            // ---------- Render ----------
            function renderList() {
                if (!requests || requests.length === 0) {
                    requestsBodyList.innerHTML = `
                        <tr class="empty-row">
                            <td colspan="8">
                                <span class="empty-icon">📭</span>
                                درخواستی ثبت نشده
                            </td>
                        </tr>
                    `;
                    return;
                }

                let html = '';
                requests.forEach((req, idx) => {
                    const isSubmitted = req.status === 'submitted';
                    const feeVal = req.fee !== undefined ? req.fee : calcFee(req.points_amount, req.price_type);
                    const timeH = req.time_hours !== undefined ? req.time_hours : calcTimeHours(req.points_amount, req
                        .price_type);

                    html += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${toPersianDigits(req.national_code)}</td>
                            <td>${toPersianDigits(formatNumber(req.points_amount))}</td>
                            <td>${getPriceDisplay(req.price_type)}</td>
                            <td>${toPersianDigits(formatNumber(Math.round(feeVal)))}</td>
                            <td>${formatTimeHours(timeH)}</td>
                            <td>
                                <span class="status-badge ${getStatusClass(req.status)}">
                                    ${getStatusLabel(req.status)}
                                </span>
                            </td>
                            <td>
    
                                                <button
                    class="delete-btn"
                    data-id="${req.id}"   <!-- ← اینجا req.id را بدون تغییر بگذارید -->
                    ${!isSubmitted ? 'disabled' : ''}
                    title="${isSubmitted ? 'حذف' : 'غیرقابل حذف'}"
                >
                    🗑️
                </button>
                            </td>
                        </tr>
                    `;
                });

                requestsBodyList.innerHTML = html;
                attachDeleteEvents();
            }

            function renderGrid() {
                if (!requests || requests.length === 0) {
                    gridView.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:28px 12px;color:#94a3b8;font-size:13px;">
                            <span style="font-size:28px;display:block;margin-bottom:4px;">📭</span>
                            درخواستی ثبت نشده
                        </div>
                    `;
                    return;
                }

                let html = '';
                requests.forEach((req, idx) => {
                    const isSubmitted = req.status === 'submitted';
                    const feeVal = req.fee !== undefined ? req.fee : calcFee(req.points_amount, req.price_type);
                    const timeH = req.time_hours !== undefined ? req.time_hours : calcTimeHours(req.points_amount, req
                        .price_type);

                    html += `
                        <div class="request-card">
                            <div class="rc-header">
                                <span class="rc-id">#${idx + 1}</span>
                                <span class="rc-status">
                                    <span class="status-badge ${getStatusClass(req.status)}">
                                        ${getStatusLabel(req.status)}
                                    </span>
                                </span>
                            </div>
                            <div class="rc-body">
                                <div class="rc-row">
                                    <span class="rc-label">کد ملی</span>
                                    <span class="rc-value">${toPersianDigits(req.national_code)}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">امتیاز</span>
                                    <span class="rc-value">${toPersianDigits(formatNumber(req.points_amount))}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">قیمت</span>
                                    <span class="rc-value">${getPriceDisplay(req.price_type)}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">اجرت (تومان)</span>
                                    <span class="rc-value">${toPersianDigits(formatNumber(Math.round(feeVal)))}</span>
                                </div>
                                <div class="rc-row">
                                    <span class="rc-label">زمان (ساعت)</span>
                                    <span class="rc-value">${formatTimeHours(timeH)}</span>
                                </div>
                                <div class="rc-row" style="border-bottom:none;padding-top:2px;">
                                    <span class="rc-label">تاریخ</span>
                                    <span class="rc-value" style="font-weight:400;font-size:10px;color:#94a3b8;">${formatDate(req.created_at)}</span>
                                </div>
                            </div>
                            <div class="rc-actions">
                   <button
                    class="delete-btn"
                    data-id="${req.id}"   <!-- ← به‌عنوان رشته -->
                    ${!isSubmitted ? 'disabled' : ''}
                    title="${isSubmitted ? 'حذف' : 'غیرقابل حذف'}"
                >
                    🗑️ حذف
                </button>
                            </div>
                        </div>
                    `;
                });

                gridView.innerHTML = html;
                gridView.querySelectorAll('.delete-btn:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', () => openDeleteModal(Number(btn.dataset.id)));
                });
            }

            function renderAll() {
                renderList();
                renderGrid();
                updateViewVisibility();
            }

function attachDeleteEvents() {
    document.querySelectorAll('#requestsBodyList .delete-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;   // ← رشته
            openDeleteModal(id);
        });
    });
}
            function updateViewVisibility() {
                if (currentView === 'list') {
                    listView.classList.remove('hidden');
                    gridView.classList.add('hidden');
                } else {
                    listView.classList.add('hidden');
                    gridView.classList.remove('hidden');
                }
                document.querySelectorAll('#viewToggle button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === currentView);
                });
            }

            function updateCounter() {
                const c = requests ? requests.length : 0;
                requestCount.textContent = toPersianDigits(String(c));
                totalRequestsBadge.textContent = toPersianDigits(String(c));
            }

            // ---------- View toggle ----------
            document.querySelectorAll('#viewToggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const view = this.dataset.view;
                    if (view === currentView) return;
                    currentView = view;
                    updateViewVisibility();
                });
            });

            // ---------- Toast ----------
            function showToast(msg, type = 'info') {
                const el = document.createElement('div');
                el.className = `toast toast-${type}`;
                el.textContent = msg;
                toastContainer.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transition = 'opacity 0.4s';
                    setTimeout(() => el.remove(), 400);
                }, 3500);
            }

            // ---------- Modal ----------
function openDeleteModal(id) {
    pendingDeleteId = id;   // ← رشته
    deleteModal.classList.remove('hidden');
}

            function closeDeleteModal() { deleteModal.classList.add('hidden');
                pendingDeleteId = null; }

            modalCancelBtn.addEventListener('click', closeDeleteModal);
            deleteModal.addEventListener('click', e => { if (e.target === deleteModal) closeDeleteModal(); });

modalConfirmBtn.addEventListener('click', async function() {
    if (pendingDeleteId === null) return;
    const id = pendingDeleteId;   // ← رشته
    try {
        modalConfirmBtn.disabled = true;
        modalConfirmBtn.innerHTML = `<span class="spinner"></span>`;
        await deleteRequestApi(id);  // ← این تابع باید رشته را بپذیرد
        requests = requests.filter(r => r.id !== id);
        renderAll();
        updateCounter();
        showToast('✅ حذف شد', 'success');
        closeDeleteModal();
    } catch (err) {
        showToast(`❌ ${err.message}`, 'error');
    } finally {
        modalConfirmBtn.disabled = false;
        modalConfirmBtn.innerHTML = `<span>🗑️</span> حذف`;
    }
});
            // ---------- Number formatting (pointsAmount) ----------
            function toEnglishDigits(str) {
                const m = {
                    '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4',
                    '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9'
                };
                return String(str).replace(/[۰-۹]/g, d => m[d] || d);
            }

            function parseNumberFromFormatted(str) {
                const onlyDigits = String(str).replace(/[^۰-۹0-9]/g, '');
                const englishDigits = toEnglishDigits(onlyDigits);
                return Number(englishDigits) || 0;
            }

            function formatNumberWithCommas(num) {
                if (!num || num === 0) return '';
                return Number(num).toLocaleString('fa-IR');
            }

            function amountChanged() {
                const rawValue = pointsAmount.value;
                const amt = parseNumberFromFormatted(rawValue);
                if (amt > 0) {
                    const formatted = formatNumberWithCommas(amt);
                    pointsAmount.value = formatted;
                    updateCalculations();
                } else {
                    pointsAmount.value = '';
                    updateCalculations();
                }
            }

            pointsAmount.addEventListener('input', amountChanged);
            pointsAmount.addEventListener('blur', amountChanged);

            // ---------- Calculations ----------
            function updateCalculations() {
                const amt = parseNumberFromFormatted(pointsAmount.value);
                const price = priceType.value;
                if (amt > 0 && price) {
                    const fee = calcFee(amt, price);
                    const hours = calcTimeHours(amt, price);
                    feeDisplay.innerHTML =
                        `${toPersianDigits(formatNumber(Math.round(fee)))} <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML =
                        `${formatTimeHours(hours)} <span class="unit">ساعت</span>`;
                } else {
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                }
            }

            // ---------- Form submit ----------
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Check token
                if (!getToken()) {
                    authError.textContent = '⚠️ لطفاً ابتدا وارد شوید.';
                    authError.classList.add('show');
                    showToast('⚠️ ابتدا وارد شوید.', 'warning');
                    return;
                }
                authError.classList.remove('show');

                const national = nationalCode.value.trim();
                const password = systemPassword.value.trim();
                const amount = parseNumberFromFormatted(pointsAmount.value);
                const price = priceType.value;

                if (!national || national.length !== 10 || !/^\d{10}$/.test(national)) {
                    showToast('کد ملی ۱۰ رقم باشد', 'error');
                    nationalCode.focus();
                    return;
                }
                if (!password || password.length < 4) {
                    showToast('پسورد حداقل ۴ کاراکتر', 'error');
                    systemPassword.focus();
                    return;
                }
                if (!amount || amount < 1) {
                    showToast('امتیاز مثبت وارد کنید', 'error');
                    pointsAmount.focus();
                    return;
                }
                if (!price) {
                    showToast('قیمت را انتخاب کنید', 'error');
                    priceType.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span>`;

                try {
                    const fee = calcFee(amount, price);
                    const timeH = calcTimeHours(amount, price);
                    const payload = {
                        national_code: national,
                        system_password: password,
                        points_amount: amount,
                        price_type: price,
                        fee: fee,
                        time_hours: timeH,
                        status: 'submitted',
                    };
                    const result = await createRequest(payload);
                    requests.push({
                        id: result.requestId || Date.now(),
                        national_code: national,
                        points_amount: amount,
                        price_type: price,
                        fee: fee,
                        time_hours: timeH,
                        status: 'submitted',
                        created_at: new Date().toISOString(),
                    });
                    renderAll();
                    updateCounter();
                    showToast('✅ ثبت شد', 'success');
                    form.reset();
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                    nationalCode.focus();
                } catch (err) {
                    showToast(`❌ ${err.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>📤</span> ثبت`;
                }
            });

            // ---------- Events ----------
            priceType.addEventListener('change', updateCalculations);

            form.addEventListener('reset', function() {
                setTimeout(() => {
                    feeDisplay.innerHTML = `۰ <span class="unit">تومان</span>`;
                    timeDisplay.innerHTML = `۰ <span class="unit">ساعت</span>`;
                }, 10);
            });

            nationalCode.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !deleteModal.classList.contains('hidden')) closeDeleteModal();
            });

            // ---------- Init ----------
            async function init() {
                // Step 1: Check for existing token
                const token = getToken();
                if (token) {
                    try {
                        // Validate token by fetching requests
                        await loadRequests();
                        if (requests && requests.length > 0) {
                            renderAll();
                            updateCounter();
                        }
                        // Try to get user info from localStorage
                        const savedUser = localStorage.getItem('tg_user_fb');
                        if (savedUser) {
                            currentUser = JSON.parse(savedUser);
                            updateUserUI();
                        }
                    } catch (e) {
                        // Token invalid, will try to re-login
                        setToken(null);
                        currentUser = null;
                        updateUserUI();
                    }
                }

                // Step 2: If no user, try auto-login
                if (!currentUser) {
                    const startParam = getStartParamFromUrl();
                    if (startParam) {
                        await handleTelegramStartParam();
                    } else {
                        const tgData = getTelegramUser();
                        if (tgData) {
                            await validateTelegramUser(tgData);
                        } else {
                            // Not in Telegram – show error
                            authError.textContent = '⚠️ لطفاً از طریق تلگرام وارد شوید.';
                            authError.classList.add('show');
                        }
                    }
                }

                // Step 3: Load requests if not loaded yet
                if (!requests || requests.length === 0) {
                    await loadRequests();
                    if (!requests || requests.length === 0) {
                        renderAll();
                        updateCounter();
                    }
                }

                // Step 4: Update UI based on login status
                updateUserUI();

                // Step 5: Focus first field
                nationalCode.focus();

                console.log('🚀 App ready | view:', currentView);
                console.log('🔑 Token present:', !!getToken());
            }

            init();

        })();
    </script>
